 apri('<div class="carta" style="max-width:560px"><p class="pic">Sfida a due · posto '+(SF.round+1)+' di 3'+(SF.ultimo?' · '+SF.ultimo:'')+'</p><h1>'+esc(SF.nomi[SF.turno])+'</h1><p>Tocca a te: '+TAGLIE[l].luogo+'.</p>'+
  (SF.round||SF.turno?tabellino():'')+'<div class="riga"><button class="b" data-a="turnovia">Pronto</button><button class="b sec" data-a="titolo">Menu</button></div></div>',true);
}
function fineTurno(){
 const p=G.soldi+G.stelle*25; SF.punti[SF.turno][SF.round]=p; SF.ultimo=esc(SF.nomi[SF.turno])+' ha incassato '+soldi(p); G.rall=0;
 if(SF.turno===0){ SF.turno=1; schermoTurno() } else { SF.turno=0; SF.round++; if(SF.round>=SF.liv.length) schermoSfidaFine(); else schermoTurno() }
}
function schermoSfidaFine(){
 G.stato='turno'; cv.classList.remove('mira'); barra.classList.remove('su'); Au.musica('bivacco'); Au.ambiente(AMB0); Au.fanfara(true);
 const tot=SF.punti.map(a=>a.reduce((s,v)=>s+(v||0),0)), v=tot[0]===tot[1]?-1:tot[0]>tot[1]?0:1;
 apri('<div class="carta" style="max-width:560px"><p class="pic">Sfida a due</p><h1>'+(v<0?'Pari e patta':'Vince '+esc(SF.nomi[v])+'!')+'</h1>'+tabellino()+
  '<div class="riga"><button class="b" data-a="rivincita">Rivincita</button><button class="b sec" data-a="titolo">Menu</button></div></div>',true);
}
function avviaSfida(a,b){
 const tutti=[0,1,2,3,4,5,6]; for(let i=tutti.length-1;i>0;i--){ const j=R()*(i+1)|0, t=tutti[i]; tutti[i]=tutti[j]; tutti[j]=t }
 SF.nomi=[a,b]; SF.liv=tutti.slice(0,3); SF.round=0; SF.turno=0; SF.punti=[[],[]]; SF.ultimo=null; schermoTurno();
}
function timbro(v){ return v?'<span class="timbro '+(v==='vivo'?'tv':'tm')+'">'+(v==='vivo'?'IN CELLA':'MORTO')+'</span>':'' }
function parete(){ const pr=leggi('parete',[]); return '<div class="muro">'+TAGLIE.map((t,i)=>'<div class="avv'+(pr[i]?'':' lib')+'" data-rit="'+i+'"><span class="ri"></span><b>'+t.s+'</b><i>'+soldi(t.t)+'</i>'+timbro(pr[i])+'</div>').join('')+'</div>' }
function appendiRitratti(){ ov.querySelectorAll('[data-rit]').forEach(el=>{ el.querySelector('.ri').appendChild(ritratto(+el.dataset.rit)) }) }
function schermoUfficio(){ const pr=leggi('parete',[]), n=pr.filter(Boolean).length, v=pr.filter(q=>q==='vivo').length;
 apri('<div class="carta" style="max-width:840px"><h2>La parete dello sceriffo</h2>'+parete()+'<p class="pic">'+(n?n+' su 7 fuori gioco, '+v+' in cella. ':'Nessun manifesto è ancora timbrato. ')+(v<7?'Presi vivi valgono il doppio.':'Tutti in cella: nessuno ha fatto meglio.')+'</p><div class="riga"><button class="b" data-a="titolo">Indietro</button></div></div>',true); appendiRitratti() }
function ritratto(liv){ const c=tela(220,264), x=c.getContext('2d'); x.fillStyle='#d9c391'; x.fillRect(0,0,220,264); figura(x,110,264+1.02*192,192,vesti(TAGLIE[liv].look,null),{arma:null,mira:0}); return c }
function schermoManifesto(liv){
 const t=TAGLIE[liv]; cv.classList.remove('mira'); barra.classList.remove('su'); G.stato='manifesto'; G.liv=liv; Au.musica('bivacco'); Au.ambiente(AMB0);
 apri('<div class="carta"><h1>RICERCATO</h1><div class="vm">VIVO O MORTO</div><div class="manif"><span id="rit"></span><div class="t"><h2>'+t.n+'</h2><p>detto <b>«'+t.s+'»</b></p><p>'+t.reati+'</p><p class="pic"><b>Segni particolari.</b> '+SEGNI[liv]+'</p><div class="taglia">'+soldi(t.t)+'</div><p class="pic">Taglia '+(liv+1)+' di 7 · '+t.luogo+', '+PAL[liv].nome+'<br>Vivo: taglia intera. Morto: la metà.</p></div></div>'+
  '<div class="riga"><button class="b" data-a="via">In sella!</button></div></div>',true);
 document.getElementById('rit').appendChild(ritratto(liv));
}
const MERCE=[{k:'tamburo',n:'Tamburo da 8',d:'Otto colpi invece di sei.',p:400},{k:'svelta',n:'Mano svelta',d:'Ricarichi in metà tempo.',p:300},{k:'falco',n:'Occhio di falco',d:'Bersagli più facili da colpire.',p:500},{k:'cuoio',n:'Gilè di cuoio',d:'Il primo colpo di ogni taglia non ti ferisce.',p:450},{k:'stella',n:'Stella in più',d:'Una vita in più, per sempre.',p:350,max:2}];
const prezzo=m=>m.p*(m.max?1+(G.pot[m.k]||0):1);
function schermoFine(){
 const r=G.riep, t=TAGLIE[G.liv];
 apri('<div class="carta"><h2>«'+t.s+'» '+(r.vivo?'è in cella':'non darà più fastidio')+'</h2>'+
  '<table class="conti"><tr><td>Taglia ('+(r.vivo?'preso vivo':'morto: metà')+')</td><td>'+soldi(r.taglia)+'</td></tr><tr><td>Banditi e bersagli ('+r.uccisi+' banditi)</td><td>'+soldi(r.daBanditi)+'</td></tr><tr><td>Precisione '+Math.round(r.acc*100)+'%</td><td>'+soldi(r.bAcc)+'</td></tr>'+(r.bIll?'<tr><td>Nemmeno un graffio</td><td>'+soldi(r.bIll)+'</td></tr>':'')+'<tr><td><b>In tasca</b></td><td>'+soldi(G.soldi)+'</td></tr></table>'+
  '<h2>L’emporio</h2><div class="bottega">'+MERCE.map(m=>{ const ha=G.pot[m.k]||0, fin=m.max?ha>=m.max:ha>0, no=fin||G.soldi<prezzo(m); return '<div class="merce'+(no?' no':'')+'" data-a="compra" data-k="'+m.k+'"><b>'+m.n+'</b>'+m.d+'<i>'+(fin?'Già tuo':soldi(prezzo(m)))+'</i></div>' }).join('')+'</div>'+
  '<div class="riga"><button class="b" data-a="avanti">Prossima taglia</button></div></div>',true);
}
function schermoPerso(){
 if(G.modo==='fine'){ const rf=leggi('recordFine',null), meglio=!rf||G.onda>rf.onde||(G.onda===rf.onde&&G.soldi>rf.soldi); if(meglio) salva('recordFine',{onde:G.onda,soldi:G.soldi});
  apri('<div class="carta"><h1>Sei a terra</h1><p>Hai retto <b>'+G.onda+'</b> '+(G.onda===1?'assalto':'assalti')+' e incassato <b>'+soldi(G.soldi)+'</b>.</p><p class="pic">'+(meglio?'È il tuo primato.':'Il primato è '+rf.onde+' assalti.')+'</p><div class="riga"><button class="b" data-a="senzafine">Ancora</button><button class="b sec" data-a="titolo">Menu</button></div></div>',true); return }
 apri('<div class="carta"><h1>Sei a terra</h1><p>Valpolvere resta senza sceriffo. «'+TAGLIE[G.liv].s+'» è ancora a piede libero.</p><p>Incassati finora: <b>'+soldi(G.soldiInizio)+'</b></p><div class="riga"><button class="b" data-a="riprova">Riprova questa taglia</button><button class="b sec" data-a="titolo">Menu</button></div></div>',true);
}
function schermoVittoria(){
 const r=G.riep, grado=G.vivi>=7?'Sceriffo galantuomo':G.vivi>=4?'Uomo di legge':G.vivi>=1?'Mano pesante':'Il Giustiziere';
 apri('<div class="carta"><h1>Valpolvere è libera</h1><p>«il Corvo» '+(r.vivo?'è in cella':'è caduto')+'. Sette taglie su sette.</p><table class="conti"><tr><td>Presi vivi</td><td>'+G.vivi+'</td></tr><tr><td>Morti</td><td>'+G.morti+'</td></tr><tr><td><b>Incasso totale</b></td><td>'+soldi(G.soldi)+'</td></tr><tr><td>Difficoltà</td><td>'+DIFF[G.diff].n+'</td></tr></table>'+parete()+'<h2>'+grado+'</h2><p class="pic">'+(G.vivi<7?'Riesci a prenderli tutti vivi?':'Nessuno ha fatto meglio.')+'</p><div class="riga"><button class="b" data-a="titolo">Menu</button></div></div>',true); appendiRitratti();
}
function pausa(v){ if(G.stato!=='gioco') return; G.pausa=v; if(v){ cv.classList.remove('mira'); apri('<div class="carta" style="max-width:420px"><h2>Pausa</h2><div class="riga"><button class="b" data-a="riprendi">Riprendi</button><button class="b sec" data-a="titolo">Menu</button></div></div>',true) } else { chiudi(); cv.classList.add('mira') } }
const AZ={
 gioca(d){ G.modo='storia'; G.diff=+d.d; G.soldi=0; G.pot={}; G.vivi=0; G.morti=0; schermoManifesto(0) },
 senzafine(){ G.modo='fine'; G.onda=0; G.diff=1; G.soldi=0; G.pot={}; G.vivi=0; G.morti=0; iniziaLivello(0) }, ufficio(){ schermoUfficio() }, leggi(){ if(G.stato==='vittoria') schermoVittoria(); else schermoFine() },
 sfida(){ schermoSfida() },
 sfidavia(){ const a=document.getElementById('n1').value.trim(), b=document.getElementById('n2').value.trim(); salva('nomi',[a,b]); avviaSfida(a||'Primo sceriffo',b||'Secondo sceriffo') },
 rivincita(){ avviaSfida(SF.nomi[1],SF.nomi[0]) },
 turnovia(){ G.modo='sfida'; G.onda=SF.round*2; G.diff=1; G.soldi=0; G.pot={}; iniziaLivello(SF.liv[SF.round]) },
 continua(){ const s=leggi('partita',null); if(!s) return; G.modo='storia'; G.diff=s.diff; G.soldi=s.soldi; G.pot=s.pot||{}; G.vivi=s.vivi||0; G.morti=s.morti||0; schermoManifesto(s.liv) },
 come(){ schermoCome() }, titolo(){ G.pausa=false; costruisciTitolo(); schermoTitolo() },
 via(){ iniziaLivello(G.liv) }, riprendi(){ pausa(false) },
 compra(d){ const m=MERCE.find(q=>q.k===d.k), ha=G.pot[m.k]||0; if((m.max?ha>=m.max:ha>0)||G.soldi<prezzo(m)) return; G.soldi-=prezzo(m); G.pot[m.k]=ha+1; Au.moneta(); schermoFine() },
 avanti(){ salva('partita',{liv:G.liv+1,diff:G.diff,soldi:G.soldi,pot:G.pot,vivi:G.vivi,morti:G.morti}); schermoManifesto(G.liv+1) },
 riprova(){ G.soldi=G.soldiInizio; iniziaLivello(G.liv) }
};
function costruisciTitolo(){ svuota(); D=null; LV=null; G.fase=''; G.barre=0; G.buio=0; G.rall=0; attiva(faiPaese(2,2,'albergo')); G.V={x:0,z:-2,yaw:0,hz:.1} }
ov.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; Au.avvia(); AZ[b.dataset.a](b.dataset) });
document.getElementById('bPausa').addEventListener('click',e=>{ e.stopPropagation(); pausa(!G.pausa) });
const bAudio=document.getElementById('bAudio'); const segnaAudio=()=>{ bAudio.style.opacity=Au.on?1:.45 }; segnaAudio();
bAudio.addEventListener('click',e=>{ e.stopPropagation(); Au.avvia(); Au.voce(!Au.on); segnaAudio() });

/* ---------------- COMANDI ---------------- */
function punto(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height] }
cv.addEventListener('mousemove',e=>{ const p=punto(e); mouse.x=p[0]; mouse.y=p[1] });
cv.addEventListener('mousedown',e=>{ e.preventDefault(); Au.avvia(); const p=punto(e); mouse.x=p[0]; mouse.y=p[1]; if(e.button===2){ ricarica(); return } if(Math.hypot(p[0]-tamb.x,p[1]-tamb.y)<tamb.r&&G.stato==='gioco'){ ricarica(); return } spara(p[0],p[1]) });
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>{ e.preventDefault(); Au.avvia(); for(const t of e.changedTouches){ const p=punto(t); if(Math.hypot(p[0]-tamb.x,p[1]-tamb.y)<tamb.r*1.15&&G.stato==='gioco'){ ricarica(); continue } mouse.x=p[0]; mouse.y=p[1]; spara(p[0],p[1]) } },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault() },{passive:false});
addEventListener('keydown',e=>{ if(e.target&&e.target.tagName==='INPUT') return; const k=e.key.toLowerCase(); if(k==='r'||k===' '){ e.preventDefault(); ricarica() } else if(k==='p'||k==='escape'){ pausa(!G.pausa) } else if(k==='m'){ Au.voce(!Au.on); segnaAudio() } });
addEventListener('resize',misura); addEventListener('orientationchange',()=>setTimeout(misura,250));
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.stato==='gioco'&&!G.pausa&&!G.auto) pausa(true) });

/* ---------------- CICLO ---------------- */
let prima=0, lenti=0, conta=0;
function giro(t){
 requestAnimationFrame(giro);
 let dt=(t-prima)/1000; prima=t; if(!(dt>0)||dt>.5) dt=.016;
 // se i fotogrammi arrivano troppo lenti (computer senza scheda video) si abbassa la definizione
 if((G.stato==='gioco'||G.stato==='titolo')&&dt<.2&&G.fase!=='buio'){ lenti+=dt; if(++conta>=30){ if(lenti/conta>.043&&ris>.5){ ris=Math.max(.5,ris*.8); misura() } conta=0; lenti=0 } }
 dt=Math.min(dt,.1);
 aggiorna(dt); disegna();
}
misura(); costruisciTitolo(); schermoTitolo(); requestAnimationFrame(giro);

// appigli per le prove (il browser interno non fa girare le animazioni da solo)
window.__taglie={G:G,cam:cam,Au:Au,BRANI:BRANI,get T(){return T},get hy(){return hy},def(v){ ris=v; misura(); return [W,H] },tizi:tizi,get D(){return D},get citta(){return citta},spara:spara,AZ:AZ,
 passi(n,dt){ for(let i=0;i<(n||1);i++){ aggiorna(dt||.033); disegna() } return this.stato() },
 get LV(){return LV}, get SF(){return SF}, cavalli:cavalli, corridore:corridore, vai(liv,diff,modo){ G.modo=modo||'storia'; G.onda=0; G.diff=diff===undefined?1:diff; iniziaLivello(liv) },
 stato(){ return {scena:citta.tipo,onda:G.onda,tappe:LV?LV.tappe.length:0,stato:G.stato,liv:G.liv,fase:G.fase,tappa:G.tappa,rimasti:G.tp?G.tp.rimasti:null,duello:D?D.stato:null,stelle:G.stelle,soldi:G.soldi,colpi:G.colpi,tizi:tizi.length,slot:G.tp?G.tp.slots.length:null,W:W,H:H} }
};
