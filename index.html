<body>
<canvas id="c"></canvas>
<div id="barra"><button id="bAudio" aria-label="Audio">♪</button><button id="bPausa" aria-label="Pausa">II</button></div>
<div id="ov"></div>
<div id="gira"><div>↻<br><br>Gira il telefono<br>in orizzontale</div></div>
<script>
'use strict';
(function(){
/* ============================================================
   SETTE TAGLIE — western in 3D da browser, un solo file, senza librerie.
   Il 3D è disegnato su tela 2D con un motore proprio (niente scheda video).
   ============================================================ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, liscio=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function casuale(seme){let a=seme>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=Math.random, tra=(a,b)=>a+R()*(b-a), scegli=a=>a[R()*a.length|0];
function tela(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgb=(c,a)=>a===undefined?'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const molt=(a,b)=>[a[0]*b[0]/255,a[1]*b[1]/255,a[2]*b[2]/255];
const chiaro=(c,k)=>mix(c,[255,255,255],k), scuro=(c,k)=>mix(c,[0,0,0],k);
const soldi=n=>'$'+Math.round(n).toLocaleString('it-IT');
function salva(k,v){try{localStorage.setItem('settetaglie.'+k,JSON.stringify(v))}catch(e){}}
function leggi(k,d){try{const v=localStorage.getItem('settetaglie.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}}

/* ---------------- SUONI E MUSICA (tutto sintetizzato) ---------------- */
const Au={ctx:null,on:leggi('audio',true),out:null,mus:null,rum:null,note:{},modo:null,pross:0,passo:0,
 avvia(){
  if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
  try{
   const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
   const c=this.ctx=new AC();
   const comp=c.createDynamicsCompressor(); comp.connect(c.destination);
   this.out=c.createGain(); this.out.gain.value=this.on?0.9:0; this.out.connect(comp);
   this.mus=c.createGain(); this.mus.gain.value=0.3; this.mus.connect(this.out);
   const n=c.sampleRate*2, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
   for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
   this.rum=b;
   // vento di fondo
   const v=c.createBufferSource(); v.buffer=b; v.loop=true;
   const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=380; f.Q.value=.6;
   const gv=c.createGain(); gv.gain.value=.035;
   const lfo=c.createOscillator(); lfo.frequency.value=.13; const gl=c.createGain(); gl.gain.value=.025; lfo.connect(gl); gl.connect(gv.gain); lfo.start();
   v.connect(f); f.connect(gv); gv.connect(this.out); v.start();
   setInterval(()=>this.batti(),90);
  }catch(e){this.ctx=null}
 },
 voce(v){this.on=v;salva('audio',v);if(this.out)this.out.gain.value=v?0.9:0},
 soffio(dur,tipo,f0,f1,vol,quando,q){
  const c=this.ctx; if(!c) return; const t=(quando||c.currentTime);
  const s=c.createBufferSource(); s.buffer=this.rum; s.loop=true;
  const f=c.createBiquadFilter(); f.type=tipo; f.Q.value=q||.8; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f); f.connect(g); g.connect(this.out); s.start(t,Math.random()); s.stop(t+dur+.02);
 },
 tono(tipo,f0,f1,dur,vol,quando,dest){
  const c=this.ctx; if(!c) return; const t=(quando||c.currentTime);
  const o=c.createOscillator(); o.type=tipo; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g); g.connect(dest||this.out); o.start(t); o.stop(t+dur+.03);
 },
 sparo(){ this.soffio(.28,'lowpass',5200,260,.95); this.tono('sine',170,38,.2,.9); this.soffio(.06,'highpass',2500,2500,.4); this.soffio(.9,'lowpass',900,150,.12,this.ctx&&this.ctx.currentTime+.05) },
 sparoLontano(){ this.soffio(.22,'lowpass',1700,200,.42); this.tono('sine',130,45,.14,.3); this.soffio(.7,'lowpass',600,120,.07,this.ctx&&this.ctx.currentTime+.06) },
 rimbalzo(){ const c=this.ctx; if(!c) return; this.tono('sawtooth',tra(2300,3200),tra(500,900),.32,.06,c.currentTime+.03) },
 vuoto(){ this.soffio(.03,'highpass',3000,3000,.3); this.tono('square',900,700,.03,.08) },
 scatto(q){ this.soffio(.025,'bandpass',2600,2600,.35,q,3); this.tono('square',1400,900,.02,.05,q) },
 ricarica(dur,n){ const c=this.ctx; if(!c) return; for(let i=0;i<n;i++) this.scatto(c.currentTime+dur*(i+.5)/(n+1.5)); this.soffio(.05,'bandpass',900,900,.5,c.currentTime+dur*.93,2); this.scatto(c.currentTime+dur*.97) },
 campana(){ const c=this.ctx; if(!c) return; [[1,.5],[2.0,.3],[2.76,.22],[3.5,.12],[5.4,.1],[6.8,.05]].forEach(p=>this.tono('sine',246*p[0],246*p[0]*.995,3.2/Math.sqrt(p[0]),p[1])); this.soffio(.05,'bandpass',1800,1800,.3,0,2) },
 vetro(){ this.soffio(.25,'highpass',3500,6000,.4); for(let i=0;i<5;i++) this.tono('sine',tra(2200,6200),tra(2000,5000),tra(.08,.3),.07,this.ctx&&this.ctx.currentTime+i*.03) },
 legno(){ this.soffio(.09,'bandpass',420,300,.7,0,1.5); this.tono('sine',190,90,.08,.3) },
 ferro(){ this.tono('square',820,790,.25,.12); this.tono('sine',1740,1700,.4,.14); this.soffio(.04,'highpass',4000,4000,.3) },
 ahi(){ this.tono('sawtooth',110,48,.4,.5); this.soffio(.3,'lowpass',700,120,.6) },
 moneta(){ const c=this.ctx; if(!c) return; this.tono('sine',1318,1318,.12,.2); this.tono('sine',1760,1760,.35,.2,c.currentTime+.08) },
 botto(){ this.soffio(1.1,'lowpass',900,60,1); this.tono('sine',90,28,.7,1) },
 tonfo(){ this.tono('sine',95,45,.18,.5); this.soffio(.1,'lowpass',300,100,.4) },
 fanfara(ok){ const c=this.ctx; if(!c) return; const n=ok?[57,60,64,69,72,76]:[57,56,52,50,45]; n.forEach((m,i)=>this.pizzica(m,c.currentTime+i*(ok?.13:.26),.5,this.out)) },
 pizzica(midi,quando,vol,dest){
  const c=this.ctx; if(!c) return;
  let b=this.note[midi];
  if(!b){ // corda pizzicata (Karplus-Strong)
   const sr=c.sampleRate, n=Math.floor(sr*1.7), N=Math.max(2,Math.round(sr/(440*Math.pow(2,(midi-69)/12))));
   b=c.createBuffer(1,n,sr); const d=b.getChannelData(0), an=new Float32Array(N);
   let pr=0; for(let i=0;i<N;i++){ const r=Math.random()*2-1; pr=pr*.45+r*.55; an[i]=pr }
   let p=0; for(let i=0;i<n;i++){ const a=an[p], q=an[(p+1)%N]; d[i]=a; an[p]=(a+q)*.4975; p=(p+1)%N }
   this.note[midi]=b;
  }
  const s=c.createBufferSource(); s.buffer=b; const g=c.createGain(); g.gain.value=vol; s.connect(g); g.connect(dest||this.mus); s.start(quando);
 },
 fischio(midi,quando,dur){
  const c=this.ctx; if(!c) return; const fr=440*Math.pow(2,(midi-69)/12);
  const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(fr*.985,quando); o.frequency.linearRampToValueAtTime(fr,quando+.07);
  const l=c.createOscillator(); l.frequency.value=5.3; const gl=c.createGain(); gl.gain.value=fr*.012; l.connect(gl); gl.connect(o.frequency);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,quando); g.gain.linearRampToValueAtTime(.16,quando+.06); g.gain.setValueAtTime(.16,quando+dur*.7); g.gain.linearRampToValueAtTime(.0001,quando+dur);
  o.connect(g); g.connect(this.mus); o.start(quando); l.start(quando); o.stop(quando+dur+.05); l.stop(quando+dur+.05);
 },
 musica(m){ if(this.modo===m) return; this.modo=m; this.passo=0; if(this.ctx) this.pross=this.ctx.currentTime+.15 },
 batti(){
  const c=this.ctx; if(!c||!this.modo||c.state!=='running') return;
  if(this.pross<c.currentTime) this.pross=c.currentTime+.05;
  while(this.pross<c.currentTime+.3){ this.suona(this.passo,this.pross); this.pross+=this.modo==='duello'?.46:.235; this.passo++ }
 },
 suona(n,t){
  if(this.modo==='duello'){
   this.tono('sine',62,40,.22,.5,t,this.mus); if(n%2) this.tono('sine',58,40,.18,.3,t+.16,this.mus);
   if(n%4===0) this.pizzica(n%8?41:40,t,.5); if(n%8===6) this.soffio(.35,'highpass',5000,7000,.05,t,1);
   return;
  }
  const giro=Math.floor(n/64), b=Math.floor(n/8)%8, s=n%8;
  const ACC=[[45,57,60,64],[45,57,60,64],[41,53,57,60],[43,55,59,62],[45,57,60,64],[45,57,60,64],[40,52,56,59],[40,52,56,59]][b];
  if(s===0||s===3||s===6) this.pizzica(ACC[0],t,.55); if(s===4) this.pizzica(ACC[0]+7,t,.4);
  if(s===2||s===6){ this.pizzica(ACC[1],t,.16); this.pizzica(ACC[2],t+.012,.16); this.pizzica(ACC[3],t+.024,.16) }
  if(this.modo==='paese'&&giro%2===1){
   const MEL=[[[0,69,3],[3,72,1],[4,76,4]],[[0,74,2],[2,72,2],[4,69,4]],[[0,77,3],[3,76,1],[4,72,4]],[[0,74,3],[3,71,1],[4,67,4]],
              [[0,69,2],[2,72,2],[4,76,2],[6,81,2]],[[0,79,4],[4,76,4]],[[0,76,6],[6,71,2]],[[0,68,2],[2,71,2],[4,76,4]]][b];
   for(const e of MEL) if(e[0]===s) this.fischio(e[1],t,e[2]*.235*.95);
  }
 }
};

/* ---------------- MOTORE 3D SU TELA 2D ---------------- */
const cv=document.getElementById('c'), g=cv.getContext('2d',{alpha:false});
let W=960,H=540,f=600,hy=270,ris=1,vign=null;
const cam={x:0,y:1.65,z:-3,yaw:0,hz:.07};
let cs=1,sn=0;
const NEAR=.25, PXM=56;
let pal=null, T={}, citta=null;
const tocco=('ontouchstart' in window)||navigator.maxTouchPoints>0;

// sull'iPhone in orizzontale la tacca copre un lato: le scritte si spostano
const sonda=document.createElement('div'); sonda.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)'; document.body.appendChild(sonda);
let bordoS=0, bordoD=0, pxc=1, grande=1;
function misura(){
 const w=Math.max(200,innerWidth), h=Math.max(150,innerHeight);
 let d=Math.min(window.devicePixelRatio||1,2)*ris; if(w*d>1280*ris) d=1280*ris/w;
 W=cv.width=Math.round(w*d); H=cv.height=Math.round(h*d); f=Math.min(.62*W,1.117*H); vign=null;
 pxc=d; grande=clamp(480/h,1,1.45); // sul telefono le scritte si ingrandiscono
 const st=getComputedStyle(sonda); bordoS=(parseFloat(st.paddingLeft)||0)*d; bordoD=(parseFloat(st.paddingRight)||0)*d;
}
// proiezione di un punto del mondo sullo schermo
function P(x,y,z){ const dx=x-cam.x, dz=z-cam.z, zr=dx*sn+dz*cs; if(zr<NEAR) return null; const k=f/zr; return {x:W/2+(dx*cs-dz*sn)*k, y:hy-(y-cam.y)*k, z:zr, k:k} }

// parete verticale con immagine, a strisce (prospettiva esatta perché la camera non si inclina)
function muro(m){
 let dx=m.ax-cam.x, dz=m.az-cam.z, ax=dx*cs-dz*sn, az=dx*sn+dz*cs;
 dx=m.bx-cam.x; dz=m.bz-cam.z; let bx=dx*cs-dz*sn, bz=dx*sn+dz*cs;
 if(az<NEAR&&bz<NEAR) return;
 let u0=m.u0,u1=m.u1;
 if(az<NEAR){ const t=(NEAR-az)/(bz-az); ax+=(bx-ax)*t; u0+=(u1-u0)*t; az=NEAR }
 else if(bz<NEAR){ const t=(NEAR-bz)/(az-bz); bx+=(ax-bx)*t; u1+=(u0-u1)*t; bz=NEAR }
 const ia=1/az, ib=1/bz, xa=W/2+ax*f*ia, xb=W/2+bx*f*ib;
 if(xb<=xa+.5||xb<0||xa>W) return;
 const hT=(m.y1-cam.y)*f, hB=(m.y0-cam.y)*f;
 const x0=Math.max(0,xa), x1=Math.min(W,xb), inv=1/(xb-xa), tw=m.tex.width, vh=m.v1-m.v0;
 const A=u0*ia, Bu=u1*ib-A, Di=ib-ia;
 // strisce larghe dove la parete è vista di fronte, strette dove è di scorcio
 const pend=Math.max(Math.abs(hT),Math.abs(hB))*Math.abs(Di)*inv;
 const sw=Math.max(m.fine?2:3,Math.min(48,1.1/Math.max(pend,1e-6),.04*Math.min(ia,ib)/Math.max(Math.abs(Di)*inv,1e-9)));
 let om=m.om||0, fo=Math.min(.88,clamp(((az+bz)*.5-8)/85,0,.75)*pal.fk), tex=m.tex;
 if(m.alfa){ // la sagoma in alto è trasparente: la foschia va stesa dentro l'immagine, non sopra

  if(G.vuotoT>0){ G.vuotoT-=dt; if(G.vuotoT<=0&&G.colpi<=0&&!(G.fase==='duello'&&D&&D.stato!=='fuoco')) ricarica() }

   else if(G.fase==='fermata') aggiornaTappa(dt);

  }

  if(i<G.colpi&&G.ric<=0){ q=g.createRadialGradient(x-rr*.3,y-rr*.3,0,x,y,rr); q.addColorStop(0,'#ffe9a0'); q.addColorStop(1,'#a8741c'); g.fillStyle=q; g.fill(); g.fillStyle='#7a5210'; g.beginPath(); g.arc(x,y,rr*.35,0,TAU); g.fill() } else { g.fillStyle='#0c0c10'; g.fill() } }
 g.fillStyle='#14151a'; g.beginPath(); g.arc(cx,cy,R0*.16,0,TAU); g.fill();
 if(G.ric>0){ g.strokeStyle='#ffe08a'; g.lineWidth=4*sc; g.beginPath(); g.arc(cx,cy,R0+6*sc,-Math.PI/2,-Math.PI/2+(1-G.ric/G.ricDur)*TAU); g.stroke() }
 else if(G.colpi<=0&&(G.tempo*3|0)%2) testo(tocco?'TOCCA: RICARICA':'R: RICARICA',cx+R0+14*sc,cy,16*sc,'#ffe08a','left');
 else if(G.colpi<G.tamburo&&G.liv===0&&G.tappa===0) testo(tocco?'tocca qui per ricaricare':'R o tasto destro: ricarica',cx+R0+14*sc,cy+R0*.6,12*sc,'#f0dcae','left');
 if(G.combo>=2) testo('×'+G.combo,W/2,H-34*sc,24*sc,'#ffe08a');
 // scritte volanti

 if(G.avv){ const a=G.avv, k=Math.min(1,a.t*5)*Math.min(1,(a.dur-a.t)*3); g.globalAlpha=clamp(k,0,1); let gr=(a.txt.length>24?30:44)*sc; g.font='700 '+gr+'px Copperplate,"Copperplate Gothic Bold",Rockwell,Georgia,serif'; const lw=g.measureText(a.txt).width; if(lw>W*.88) gr*=W*.88/lw; testo(a.txt,W/2,H*.3,gr*(1+.08*(1-Math.min(1,a.t*5))),'#ffe9b0',null,.18); if(a.sub){ let gs=17*sc; g.font='700 '+gs+'px Copperplate,"Copperplate Gothic Bold",Rockwell,Georgia,serif'; const ls=g.measureText(a.sub).width; if(ls>W*.9) gs*=W*.9/ls; testo(a.sub,W/2,H*.3+gr*.95,gs,'#fff') } g.globalAlpha=1 }
 // mirino

  for(let p=0;p<2;p++){ g.beginPath(); g.arc(x,y,r,0,TAU); for(let i=0;i<4;i++){ const a=i*Math.PI/2; g.moveTo(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55); g.lineTo(x+Math.cos(a)*r*1.5,y+Math.sin(a)*r*1.5) } g.stroke(); g.lineWidth=1.8*sc; g.strokeStyle=G.ric>0?'#ffb060':'#fff' }
  g.fillStyle='#ff3a2a'; g.beginPath(); g.arc(x,y,1.8*sc,0,TAU); g.fill() }

function disegna(){
 g.setTransform(1,0,0,1,0,0); g.globalAlpha=1; g.globalCompositeOperation='source-over';

 const pf=G.prof, q0=pf?performance.now():0;

 const q1=pf?performance.now():0;

 if(pf){ g.getImageData(0,0,1,1); pf.arma=(pf.arma||0)+performance.now()-q1 }
 if(!vign){ vign=tela(W,H); const c=vign.getContext('2d'), q=c.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,Math.hypot(W,H)*.56); q.addColorStop(0,'rgba(0,0,0,0)'); q.addColorStop(1,'rgba(10,4,0,.62)'); c.fillStyle=q; c.fillRect(0,0,W,H) }
 const q2=pf?performance.now():0; if(!(G.salta&&G.salta.vign)) g.drawImage(vign,0,0); if(pf){ g.getImageData(0,0,1,1); pf.vign=(pf.vign||0)+performance.now()-q2 }
 if(G.lampo>0){ g.fillStyle='rgba(255,230,170,'+G.lampo*.8+')'; g.fillRect(0,0,W,H) }
 if(G.rosso>0){ const q=g.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.9); q.addColorStop(0,'rgba(170,0,0,0)'); q.addColorStop(1,'rgba(190,10,0,'+G.rosso*.75+')'); g.fillStyle=q; g.fillRect(0,0,W,H) }

}

/* ---------------- SCHERMATE ---------------- */
const ov=document.getElementById('ov'), barra=document.getElementById('barra');

function schermoTitolo(){
 G.stato='titolo'; G.tF=0; cv.classList.remove('mira'); barra.classList.remove('su'); Au.musica('paese');
 const sal=leggi('partita',null), rec=leggi('record',0);

  '<div class="riga">'+DIFF.map((d,i)=>'<button class="b" data-a="gioca" data-d="'+i+'">'+d.n+'</button>').join('')+'</div>'+
  '<div class="riga">'+(sal&&sal.liv>0?'<button class="b sec" data-a="continua">Continua · taglia '+(sal.liv+1)+'</button>':'')+'<button class="b sec" data-a="come">Come si gioca</button></div>'+
  (rec?'<div class="rec">Record: '+soldi(rec)+' incassati</div>':'')+'</div>');
}
function schermoCome(){
 apri('<div class="carta"><h2>Come si gioca</h2>'+
  '<p><b>Mira e spara.</b> '+(tocco?'Tocca il punto dove vuoi sparare.':'Muovi il mouse e fai clic.')+' Nel tamburo ci sono sei colpi: ricarichi '+(tocco?'toccando il tamburo in basso a sinistra':'con <b>R</b>, la barra spaziatrice o il tasto destro')+'.</p>'+
  '<p><b>Il cerchio sopra un bandito</b> è il tempo che gli resta per spararti. Se si chiude, perdi una stella. Finite le stelle, finita la partita.</p>'+
  '<p><b>Mani alzate = cittadino.</b> Non sparare. La <b>dinamite</b> si colpisce al volo, prima che arrivi.</p>'+
  '<p><b>Il duello.</b> In fondo a ogni via ti aspetta il ricercato. Aspetta la campana: chi spara prima perde l’onore. Poi sii svelto. Se gli colpisci <b>la mano con la pistola</b> lo prendi <b>vivo</b> e incassi la taglia intera. Se lo colpisci altrove, <b>morto</b> vale la metà.</p>'+
  '<div class="riga"><button class="b" data-a="titolo">Ho capito</button></div></div>',true);
}
function ritratto(liv){ const c=tela(220,264), x=c.getContext('2d'); x.fillStyle='#d9c391'; x.fillRect(0,0,220,264); figura(x,110,264+1.02*192,192,vesti(TAGLIE[liv].look,null),{arma:null,mira:0}); return c }
function schermoManifesto(liv){
 const t=TAGLIE[liv]; cv.classList.remove('mira'); barra.classList.remove('su'); G.stato='manifesto'; G.liv=liv;
 apri('<div class="carta"><h1>RICERCATO</h1><div class="vm">VIVO O MORTO</div><div class="manif"><span id="rit"></span><div class="t"><h2>'+t.n+'</h2><p>detto <b>«'+t.s+'»</b></p><p>'+t.reati+'</p><div class="taglia">'+soldi(t.t)+'</div><p class="pic">Taglia '+(liv+1)+' di 7 · '+t.luogo+', '+PAL[liv].nome+'<br>Vivo: taglia intera. Morto: la metà.</p></div></div>'+
  '<div class="riga"><button class="b" data-a="via">In sella!</button></div></div>',true);
 document.getElementById('rit').appendChild(ritratto(liv));
}
const MERCE=[{k:'tamburo',n:'Tamburo da 8',d:'Otto colpi invece di sei.',p:400},{k:'svelta',n:'Mano svelta',d:'Ricarichi in metà tempo.',p:300},{k:'falco',n:'Occhio di falco',d:'Bersagli più facili da colpire.',p:500},{k:'cuoio',n:'Gilè di cuoio',d:'Il primo colpo di ogni taglia non ti ferisce.',p:450},{k:'stella',n:'Stella in più',d:'Una vita in più, per sempre.',p:350,max:2}];
const prezzo=m=>m.p*(m.max?1+(G.pot[m.k]||0):1);
function schermoFine(){
 const r=G.riep, t=TAGLIE[G.liv];
 apri('<div class="carta"><h2>«'+t.s+'» '+(r.vivo?'è in cella':'non darà più fastidio')+'</h2>'+
  '<table class="conti"><tr><td>Taglia ('+(r.vivo?'preso vivo':'morto: metà')+')</td><td>'+soldi(r.taglia)+'</td></tr><tr><td>Banditi e bersagli ('+r.uccisi+' banditi)</td><td>'+soldi(r.daBanditi)+'</td></tr><tr><td>Precisione '+Math.round(r.acc*100)+'%</td><td>'+soldi(r.bAcc)+'</td></tr>'+(r.bIll?'<tr><td>Nemmeno un graffio</td><td>'+soldi(r.bIll)+'</td></tr>':'')+'<tr><td><b>In tasca</b></td><td>'+soldi(G.soldi)+'</td></tr></table>'+
  '<h2>L’emporio</h2><div class="bottega">'+MERCE.map(m=>{ const ha=G.pot[m.k]||0, fin=m.max?ha>=m.max:ha>0, no=fin||G.soldi<prezzo(m); return '<div class="merce'+(no?' no':'')+'" data-a="compra" data-k="'+m.k+'"><b>'+m.n+'</b>'+m.d+'<i>'+(fin?'Già tuo':soldi(prezzo(m)))+'</i></div>' }).join('')+'</div>'+
  '<div class="riga"><button class="b" data-a="avanti">Prossima taglia</button></div></div>',true);
}
function schermoPerso(){
 apri('<div class="carta"><h1>Sei a terra</h1><p>Valpolvere resta senza sceriffo. «'+TAGLIE[G.liv].s+'» è ancora a piede libero.</p><p>Incassati finora: <b>'+soldi(G.soldiInizio)+'</b></p><div class="riga"><button class="b" data-a="riprova">Riprova questa taglia</button><button class="b sec" data-a="titolo">Menu</button></div></div>',true);
}
function schermoVittoria(){
 const r=G.riep, grado=G.vivi>=7?'Sceriffo galantuomo':G.vivi>=4?'Uomo di legge':G.vivi>=1?'Mano pesante':'Il Giustiziere';
 apri('<div class="carta"><h1>Valpolvere è libera</h1><p>«il Corvo» '+(r.vivo?'è in cella':'è caduto')+'. Sette taglie su sette.</p><table class="conti"><tr><td>Presi vivi</td><td>'+G.vivi+'</td></tr><tr><td>Morti</td><td>'+G.morti+'</td></tr><tr><td><b>Incasso totale</b></td><td>'+soldi(G.soldi)+'</td></tr><tr><td>Difficoltà</td><td>'+DIFF[G.diff].n+'</td></tr></table><h2>'+grado+'</h2><p class="pic">'+(G.vivi<7?'Riesci a prenderli tutti vivi?':'Nessuno ha fatto meglio.')+'</p><div class="riga"><button class="b" data-a="titolo">Menu</button></div></div>',true);
}
function pausa(v){ if(G.stato!=='gioco') return; G.pausa=v; if(v){ cv.classList.remove('mira'); apri('<div class="carta" style="max-width:420px"><h2>Pausa</h2><div class="riga"><button class="b" data-a="riprendi">Riprendi</button><button class="b sec" data-a="titolo">Menu</button></div></div>',true) } else { chiudi(); cv.classList.add('mira') } }
const AZ={
 gioca(d){ G.diff=+d.d; G.soldi=0; G.pot={}; G.vivi=0; G.morti=0; schermoManifesto(0) },

 dt=Math.min(dt,.1);

}
